workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pods
        script: |
          cd src
          pod install || true
      - name: List workspace and schemes
        script: |
          cd src
          ls -la
          xcodebuild -list -workspace *.xcworkspace || xcodebuild -list -project *.xcodeproj
      - name: Build iOS app (no signing)
        script: |
          cd src
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          xcodebuild -workspace "$WORKSPACE" -scheme "Mood Tracker" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
    artifacts:
      - src/build/**/*.app
