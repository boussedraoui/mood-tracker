workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MoodTrackerKey
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pods
        script: |
          cd src
          pod install || true
      - name: Set up code signing
        script: |
          cd src
          keychain initialize
          app-store-connect fetch-signing-files "com.moodtracker.daily" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "Mood Tracker.xcodeproj"
      - name: Build iOS app
        script: |
          cd src
          xcode-project build-ipa --project "Mood Tracker.xcodeproj" --scheme "Mood Tracker"
    artifacts:
      - build/ios/ipa/*.ipa
