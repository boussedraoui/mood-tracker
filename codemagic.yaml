workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MoodTrackerKey2
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.moodtracker.daily
    scripts:
      - name: Install pods
        script: |
          cd src
          pod install || true
      - name: Set up code signing
        script: |
          cd src
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          cd src
          xcode-project build-ipa --workspace "Mood Tracker.xcworkspace" --scheme "Mood Tracker"
    artifacts:
      - build/ios/ipa/*.ipa
